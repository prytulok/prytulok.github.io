<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Повна база модерації</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f8f9fa; }
        h2 { color: #2c3e50; border-bottom: 3px solid #007bff; padding-bottom: 10px; }
        
        .container { overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 40px; }
        
        table { width: 100%; border-collapse: collapse; min-width: 1200px; }
        th, td { padding: 10px; border: 1px solid #dee2e6; text-align: left; font-size: 0.85rem; }
        th { background: #e9ecef; color: #495057; font-weight: bold; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        tr:hover { background-color: #e2e6ea; }
        
        .id-cell { font-weight: bold; color: #007bff; }
        .date-cell { color: #6c757d; font-size: 0.75rem; }
        .status-badge { background: #ffc107; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
    </style>
</head>
<body>

    <h2>📍 Таблиця: LOCATIONS (is_verified = 0)</h2>
    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cat_ID</th>
                    <th>Name</th>
                    <th>Address</th>
                    <th>Lat</th>
                    <th>Lng</th>
                    <th>Working Hours</th>
                    <th>Phone</th>
                    <th>Comment</th>
                    <th>Verified</th>
                    <th>Created At</th>
                </tr>
            </thead>
            <tbody id="locBody">
                <tr><td colspan="11" style="text-align:center;">Завантаження локацій...</td></tr>
            </tbody>
        </table>
    </div>

    <h2>💬 Таблиця: REVIEWS (is_verified = 0)</h2>
    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Loc_ID</th>
                    <th>Text</th>
                    <th>Verified</th>
                    <th>Created At</th>
                </tr>
            </thead>
            <tbody id="revBody">
                <tr><td colspan="5" style="text-align:center;">Завантаження відгуків...</td></tr>
            </tbody>
        </table>
    </div>

<script>
    const API_URL = 'https://shelter-api.basyliydelcreatore-01.workers.dev';

    async function fetchData() {
        try {
            const res = await fetch(`${API_URL}/api/admin/pending`);
            const data = await res.json();

            // Рендер LOCATIONS
            const locBody = document.getElementById('locBody');
            locBody.innerHTML = data.locations.length ? data.locations.map(l => `
                <tr>
                    <td class="id-cell">${l.id}</td>
                    <td>${l.category_id}</td>
                    <td><strong>${l.name || ''}</strong></td>
                    <td>${l.address || ''}</td>
                    <td>${l.lat}</td>
                    <td>${l.lng}</td>
                    <td>${l.working_hours || ''}</td>
                    <td>${l.phone || ''}</td>
                    <td>${l.comment || ''}</td>
                    <td><span class="status-badge">${l.is_verified}</span></td>
                    <td class="date-cell">${l.created_at || '-'}</td>
                </tr>
            `).join('') : '<tr><td colspan="11" style="text-align:center;">Немає даних</td></tr>';

            // Рендер REVIEWS
            const revBody = document.getElementById('revBody');
            revBody.innerHTML = data.reviews.length ? data.reviews.map(r => `
                <tr>
                    <td class="id-cell">${r.id}</td>
                    <td>${r.location_id}</td>
                    <td>${r.text}</td>
                    <td><span class="status-badge">${r.is_verified}</span></td>
                    <td class="date-cell">${r.created_at || '-'}</td>
                </tr>
            `).join('') : '<tr><td colspan="5" style="text-align:center;">Немає даних</td></tr>';

        } catch (e) {
            console.error(e);
            alert("Помилка при отриманні даних з бази.");
        }
    }

    fetchData();
</script>
</body>
</html>
