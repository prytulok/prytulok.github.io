<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Панель модератора</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        h2 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; background: white; margin-bottom: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #f8f9fa; }
        tr:hover { background: #f1f1f1; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; background: #ffc107; }
        .btn-approve { background: #28a745; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>📍 Локації на модерацію (is_verified = 0)</h2>
    <table id="locTable">
        <thead>
            <tr>
                <th>Назва</th>
                <th>Адреса</th>
                <th>Контакти</th>
                <th>Коментар</th>
                <th>Координати</th>
            </tr>
        </thead>
        <tbody id="locBody"><tr><td colspan="5">Завантаження...</td></tr></tbody>
    </table>

    <h2>💬 Відгуки на модерацію (is_verified = 0)</h2>
    <table id="revTable">
        <thead>
            <tr>
                <th>ID Локації</th>
                <th>Текст відгуку</th>
                <th>Дата</th>
            </tr>
        </thead>
        <tbody id="revBody"><tr><td colspan="3">Завантаження...</td></tr></tbody>
    </table>

<script>
    const API_URL = 'https://shelter-api.basyliydelcreatore-01.workers.dev';

    async function loadAdminData() {
        try {
            const res = await fetch(`${API_URL}/api/admin/pending`);
            const data = await res.json();

            // Рендерим локації
            const locBody = document.getElementById('locBody');
            locBody.innerHTML = data.locations.length ? data.locations.map(loc => `
                <tr>
                    <b>${loc.name}</b></td>
                    <td>${loc.address}</td>
                    <td>${loc.phone || '-'}<br><small>${loc.working_hours || '-'}</small></td>
                    <td><i>${loc.comment || ''}</i></td>
                    <td><small>${loc.lat.toFixed(4)}, ${loc.lng.toFixed(4)}</small></td>
                </tr>
            `).join('') : '<tr><td colspan="5">Немає нових локацій</td></tr>';

            // Рендерим відгуки
            const revBody = document.getElementById('revBody');
            revBody.innerHTML = data.reviews.length ? data.reviews.map(rev => `
                <tr>
                    <td>#${rev.location_id}</td>
                    <td>${rev.text}</td>
                    <td><small>${rev.created_at || ''}</small></td>
                </tr>
            `).join('') : '<tr><td colspan="3">Немає нових відгуків</td></tr>';

        } catch (e) {
            alert("Помилка завантаження даних");
        }
    }

    loadAdminData();
</script>
</body>
</html>
